# The three-pass sync, the cache-header policy and the CloudFront invalidation all live in
# theted/infrastructure/.github/workflows/deploy-static.yml, and the reasoning behind them in that
# repo's static-s3.md. This repo used to carry its own copy; it is the source the reusable workflow
# was generalised from, so nothing about the deploy changes here beyond where the steps are kept.
name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would interleave their uploads and their deletes,
# and the loser could delete assets the winner had just published. This has to stay in the caller:
# the reusable workflow runs inside this workflow's run, so this is the only place a concurrency
# group covering it can be declared.
concurrency:
  group: deploy-s3
  cancel-in-progress: true

jobs:
  deploy:
    uses: theted/infrastructure/.github/workflows/deploy-static.yml@master
    with:
      node-version: '22'
      # `npm run data` is deliberately not run here. It needs ~2 GB of raw WorldClim, NOAA and
      # Natural Earth downloads that are gitignored; the *baked* rasters under public/data are
      # committed instead, so CI only has to bundle them. Refreshing the climatology is a local
      # `npm run data` and a commit.
      #
      # verify:bundle is the check the shared workflow cannot make: that those rasters actually
      # reached dist/. See scripts/verify-bundle.sh.
      build-command: npm run build && npm run verify:bundle
      dist-dir: dist
    secrets: inherit
